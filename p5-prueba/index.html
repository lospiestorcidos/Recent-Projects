<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba p5.js</title>
<style>html,body{margin:0;background:#111;overflow:hidden}</style>
<script src="p5.min.js"></script>
</head>
<body>
<script>
// Círculos de colores que siguen al ratón y dejan estela
function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 1);
  noStroke();
}
function draw() {
  background(0, 0, 7, 0.12);
  const n = 12;
  for (let i = 0; i < n; i++) {
    const a = frameCount * 0.02 + (TWO_PI / n) * i;
    const r = 120 + 40 * sin(frameCount * 0.03 + i);
    const cx = (mouseX || width / 2) + cos(a) * r;
    const cy = (mouseY || height / 2) + sin(a) * r;
    fill((frameCount + i * 30) % 360, 80, 100, 0.9);
    circle(cx, cy, 24);
  }
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
